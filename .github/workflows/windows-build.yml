name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install icon tooling
        run: python -m pip install --disable-pip-version-check pillow

      - name: Vet
        run: go vet ./...

      - name: Build
        shell: cmd
        run: build.bat

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: Typora-v4.20-windows-x64
          path: Typora-v4.20.exe
          if-no-files-found: error
